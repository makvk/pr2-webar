<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WebAR – Практика 2</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Индикатор ошибки, если файл targets.mind не найден */
    #error-dialog {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(220, 53, 69, 0.95);
      color: #fff;
      padding: 20px;
      border-radius: 12px;
      max-width: 85%;
      z-index: 999999;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- Блок уведомления об ошибке -->
  <div id="error-dialog">
    <h3 style="margin-top:0">⚠️ Камера не запускается</h3>
    <p id="error-msg">Файл <b>targets.mind</b> не найден в репозитории на GitHub (код 404).<br><br>Скомпилируйте маркер и загрузите <code>targets.mind</code> в корень репозитория!</p>
  </div>

  <script>
    // Проверка наличия targets.mind перед запуском сцены
    fetch('./targets.mind', { method: 'HEAD' })
      .then(response => {
        if (!response.ok) {
          const errBox = document.getElementById('error-dialog');
          if (errBox) errBox.style.display = 'block';
        }
      })
      .catch(err => {
        console.error('Ошибка проверки targets.mind:', err);
      });
  </script>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <!-- Камера -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Освещение -->
    <a-light type="ambient" color="#ffffff" intensity="1.0"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.2" position="1 2 1"></a-light>

    <!-- Трекер маркера (targetIndex: 0 — первый маркер в файле) -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- 3D модель картины Wall.glb появляется на маркере -->
      <a-gltf-model
        src="./Wall.glb"
        position="0 -0.5 0"
        scale="0.08 0.08 0.08"
        rotation="0 0 0"
      ></a-gltf-model>

    </a-entity>

  </a-scene>

</body>
</html>
